spring.application.name=mindease

# --- Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/mindease_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234

# --- JPA/Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Server Configuration ---
server.port=8080

# --- JWT Configuration ---
# !!! REPLACE THIS with your own long, random, secret key !!!
# JWT Configuration
jwt.secret=YourVeryStrongAndSecretKeyThatIsAtLeast256BitsLongSoKeepTypingSomethingSecure
jwt.expirationMs=86400000